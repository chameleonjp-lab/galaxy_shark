name: Deploy GALAXY SHARK to GitHub Pages

on:
  pull_request:
    paths:
      - index.html
      - ranking-client.js
      - ranking-manifest.json
      - tools/check-x-share.mjs
      - tools/i18n/**
      - vendor/**
      - i18n/**
      - ogp.jpg
      - .github/workflows/pages.yml
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare site
        run: |
          node --check ranking-client.js
          node --test tools/check-x-share.mjs
          install -Dm644 index.html _site/index.html
          install -Dm644 ranking-client.js _site/ranking-client.js
          install -Dm644 ranking-manifest.json _site/ranking-manifest.json
          install -Dm644 ogp.jpg _site/ogp.jpg
          install -Dm644 -t _site/vendor vendor/three.min.js vendor/three.LICENSE vendor/fonts.LICENSE
          install -Dm644 -t _site/i18n i18n/*.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      # The upload can complete before the artifact service lists the file.
      - name: Allow time for the Pages artifact to become visible
        run: sleep 15
      - uses: actions/deploy-pages@v4
        id: deployment
