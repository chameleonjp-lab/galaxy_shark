<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
/*FONTS*/

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#050508}
.stage{position:relative;width:1200px;height:630px;overflow:hidden;background:#050508}
.panel{position:absolute;top:-10px;height:650px;background-size:cover;background-position:center;}
.panel::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(5,5,8,.28) 30%,transparent 33%) 0 0/9px 9px;mix-blend-mode:multiply}
.p1{left:-20px;width:520px;clip-path:polygon(0 0,100% 0,82% 100%,0 100%);background-image:url({{p1}});background-position:42% 60%;background-size:150%}
.p2{left:420px;width:440px;clip-path:polygon(22% 0,100% 0,80% 100%,0 100%);background-image:url({{p2}});background-position:50% 40%;background-size:170%}
.p3{left:770px;width:460px;clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);background-image:url({{p4}});background-position:50% 35%;background-size:160%}
.speed{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 74% 52%,rgba(255,255,255,.0) 0deg 4deg,rgba(255,255,255,.55) 4deg 5deg);
  -webkit-mask:radial-gradient(circle at 74% 52%,transparent 0 210px,#000 420px);mask:radial-gradient(circle at 74% 52%,transparent 0 210px,#000 420px);opacity:.75}
.frame{position:absolute;inset:0;border:12px solid #050508}
.burst,.burst::after{position:absolute;clip-path:polygon(50.0% 0.0%,55.9% 16.5%,67.1% 3.0%,69.0% 17.1%,82.1% 11.7%,76.0% 28.1%,93.3% 25.0%,85.7% 37.0%,99.2% 41.3%,84.0% 50.0%,99.2% 58.7%,85.7% 63.0%,93.3% 75.0%,76.0% 71.9%,82.1% 88.3%,69.0% 82.9%,67.1% 97.0%,55.9% 83.5%,50.0% 100.0%,44.1% 83.5%,32.9% 97.0%,31.0% 82.9%,17.9% 88.3%,24.0% 71.9%,6.7% 75.0%,14.3% 63.0%,0.8% 58.7%,16.0% 50.0%,0.8% 41.3%,14.3% 37.0%,6.7% 25.0%,24.0% 28.1%,17.9% 11.7%,31.0% 17.1%,32.9% 3.0%,44.1% 16.5%)}
.burst{left:-70px;top:40px;width:760px;height:470px;background:#050508;transform:rotate(-6deg)}
.burst::after{content:'';inset:3.5%;background:radial-gradient(circle,rgba(255,42,133,.45) 26%,transparent 28%) 0 0/12px 12px,radial-gradient(circle at 50% 50%,#FFF7A0 0%,#FFE600 45%,#FF9E00 100%)}
.shark{position:absolute;right:6px;top:84px;width:660px;transform:rotate(-7deg);
  filter:drop-shadow(5px 0 0 #050508) drop-shadow(-5px 0 0 #050508) drop-shadow(0 5px 0 #050508) drop-shadow(0 -5px 0 #050508) drop-shadow(14px 14px 0 #FF2A85)}
.logo{position:absolute;left:40px;top:92px;width:600px;text-align:center;font-family:'GS Bangers';font-size:150px;line-height:.84;letter-spacing:.03em;transform:skewX(-8deg) rotate(-5deg)}
.logo span{display:block;background:linear-gradient(180deg,#FFF 0%,#FFF200 30%,#FF8A00 62%,#FF1744 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:.05em #050508;paint-order:stroke fill;
  filter:drop-shadow(.02em .02em 0 #050508) drop-shadow(.02em .02em 0 #050508) drop-shadow(.02em .02em 0 #050508) drop-shadow(.05em .05em 0 #FF2A85)}
.logo .l2{font-size:1.18em;margin-left:.35em}
.ja{position:absolute;left:62px;top:48px;font-family:'GS Dela';font-size:30px;color:#FFE600;background:#050508;padding:4px 16px 8px;transform:rotate(-6deg) skewX(-10deg);box-shadow:6px 6px 0 #FF1744}
.tag{position:absolute;left:58px;top:430px;transform:rotate(-4deg) skewX(-10deg)}
.tag span{display:inline-block;font-family:'GS Dela';font-size:36px;color:#FFF;background:#FF1744;border:5px solid #050508;box-shadow:8px 8px 0 #050508;padding:.14em .6em .22em;-webkit-text-stroke:.14em #050508;paint-order:stroke fill}
.play{position:absolute;right:46px;bottom:40px;font-family:'GS Dela';font-size:34px;color:#050508;background:linear-gradient(180deg,#FFE600,#FF6A00);border:5px solid #050508;box-shadow:7px 7px 0 #050508;padding:6px 26px 10px;transform:rotate(-3deg) skewX(-10deg)}
</style></head><body><div class="stage">
<div class="panel p1"></div><div class="panel p2"></div><div class="panel p3"></div>
<div class="speed"></div>
<div class="burst"></div>
<img class="shark" src="{{shark_c}}">
<div class="ja">ギャラクシーシャーク</div>
<div class="logo"><span class="l1">GALAXY</span><span class="l2">SHARK</span></div>
<div class="tag"><span>食って、伸びて、銀河まで丸呑み!!</span></div>
<div class="play">スタート!!</div>
<div class="frame"></div>
</div></body></html>
